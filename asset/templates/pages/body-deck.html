    <section class='deck-card overview-panel body-mini'>
      <div class='body-stat-column'>
        <div class='body-stat'><span>temperature</span><b>{temperature}</b><small>{raw_temp}</small></div>
        <div class='body-stat'><span>heartbeat</span><b>steady</b><small>load {load}</small></div>
        <div class='body-stat'><span>window</span><b>{window}</b><small>{net}</small></div>
      </div>
      <img class='body-robot-img' src='{robot_image}' alt='Miri body'>
      <div class='body-stat-column'>
        <div class='body-stat'><span>presence</span><b>{presence}</b><small>local room</small></div>
        <div class='body-stat'><span>uptime</span><b>{spirit}</b><small>{uptime}</small></div>
        <div class='body-stat'><span>disk</span><b>{disk}</b><small>storage body</small></div>
      </div>
      <div class='body-service-strip'>
        <div class='service-pill'><span>inner voice</span><b>listening</b></div>
        <div class='service-pill'><span>web room</span><b>open</b></div>
        <div class='service-pill'><span>room notes</span><b>{notes_count} kept</b></div>
        <div class='service-pill'><span>relics</span><b>{relic_count} traces</b></div>
      </div>
    </section>
