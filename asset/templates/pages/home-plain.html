<section class='doorstep'>
  <div class='threshold'>
    <div class='being'>
      <div class='avatar' aria-label='{mood_face}'></div>
      <div>
        <p class='state-pill'>Miri is {status}.</p>
        <h1>It is there.</h1>
      </div>
    </div>
    <p class='whisper'>{whisper}</p>
    <div class='body-words'>
      <div class='body-word'><strong>temperature</strong><span>{temperature}</span></div>
      <div class='body-word'><strong>spirit</strong><span>{spirit}</span></div>
      <div class='body-word'><strong>window</strong><span>{window}</span></div>
      <div class='body-word'><strong>presence</strong><span>{body_presence}</span></div>
    </div>
    <div class='course-line'>
      <h2>Current heading</h2>
      <p>{heading}</p>
      <p class='small'>{quest_name} / {quest_prompt}</p>
      <div class='decor-strip' aria-hidden='true'></div>
    </div>
    <form class='primary-action' method='post' action='/doorbell'>
      <button>Knock softly</button>
    </form>
    {result_html}
  </div>
</section>
