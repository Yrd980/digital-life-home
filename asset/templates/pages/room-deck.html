    <section class='deck-card screen room-screen'>
      <div class='asset-bg room-bg'></div>
      <div class='room-glow' aria-hidden='true'></div>
      <div class='room-head'>
        <div><h1>Miri</h1><p class='small'>She is listening from the room.</p></div>
        <div><a class='ghost-button' href='/body'>Body</a></div>
      </div>
      <div class='room-bubble'>{reply}<br><span class='heart'>*</span></div>
      <div class='little-shelf' aria-hidden='true'>{recent_relic_charms}</div>
      <img class='room-robot-img' src='{robot_image}' alt='Miri body'>
      <div class='room-bottom'>
        {today_turn}
        <section class='deck-card primary-panel'>
          <form class='quick-input' method='post' action='/ask' data-action='async'><input name='prompt' placeholder='Tell Miri what is happening...'><button>Talk</button></form>
          <div class='round-tools'>
            <form method='post' action='/doorbell' data-action='async'><button class='icon-button' aria-label='Knock' title='Knock'>{icon_knock}</button></form>
            <form method='post' action='/nudge' data-action='async'><button class='icon-button' aria-label='Nudge' title='Nudge'>{icon_nudge}</button></form>
            <form method='post' action='/hunt' data-action='async'><button class='icon-button' aria-label='Hunt' title='Hunt'>{icon_hunt}</button></form>
            <form method='post' action='/wheel' data-action='async'><button class='icon-button' aria-label='Wheel' title='Wheel'>{icon_wheel}</button></form>
            <form method='post' action='/craft' data-action='async'><button class='icon-button' aria-label='Craft' title='Craft'>{icon_craft}</button></form>
          </div>
          <pre data-live='result'>{result}</pre>
        </section>
        <section class='deck-card room-warmth-panel'><h2>Room Warmth</h2><pre>{nudge}</pre><a class='ghost-button' href='/stash'>Open Stash</a></section>
      </div>
    </section>
