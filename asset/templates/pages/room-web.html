    <section class='game-room is-{room_phase} {room_flags}' data-room data-room-phase='{room_phase}' data-miri-state='{miri_state}'>
      <section class='game-stage' aria-label='Miri room'>
        <div class='room-frame'>
          <div class='room-layer room-background'>
            <img class='room-photo' src='{room_image}' alt='Miri room'>
          </div>

          <div class='room-layer ambient-fx' aria-hidden='true'>
            <span class='fx fx-light-bloom'></span>
            <span class='fx fx-screen-glow'></span>
            <span class='fx fx-window-rain'></span>
            <span class='fx fx-dust fx-dust-a'></span>
            <span class='fx fx-dust fx-dust-b'></span>
            <span class='fx fx-tiny-spark'></span>
          </div>

          <div class='room-layer persistent-items' aria-hidden='true'>
            <span class='floor-item item-paper'></span>
            <span class='floor-item item-cable'></span>
            <span class='floor-item item-package'></span>
            <span class='floor-item item-books'></span>
          </div>

          <span class='hotspot-glow' data-hotspot-glow aria-hidden='true'></span>
          <img class='miri-character' src='{miri_image}' alt='Miri' data-miri-character>

          <div class='room-layer hotspot-layer'>
            <button class='ambient-zone zone-miri' type='button' data-air-prompt data-hotspot='miri' aria-label='Speak near Miri'></button>
            <form class='ambient-form zone-knock' method='post' action='/doorbell' data-action='async' data-hotspot='door'><button class='ambient-zone' type='submit' aria-label='Knock'></button></form>
            <button class='ambient-zone zone-pinboard' type='button' data-panel-target='pinboard' data-hotspot='pinboard' aria-label='Open Pinboard'></button>
            <button class='ambient-zone zone-shelf' type='button' data-panel-target='shelf' data-hotspot='shelf' aria-label='Open Shelf'></button>
            <button class='ambient-zone zone-daily' type='button' data-panel-target='daily' data-hotspot='daily' aria-label='Open Daily'></button>
            <button class='ambient-zone zone-body' type='button' data-panel-target='body' data-hotspot='body' aria-label='Open Body'></button>
            <form class='ambient-form zone-find' method='post' action='/hunt' data-action='async' data-hotspot='floor'><button class='ambient-zone' type='submit' aria-label='Find'></button></form>
            <form class='ambient-form zone-craft' method='post' action='/craft' data-action='async' data-hotspot='craft'><button class='ambient-zone' type='submit' aria-label='Craft'></button></form>
          </div>

          <div class='room-layer foreground-layer' aria-hidden='true'>
            <span class='foreground-prop foreground-desk-edge'></span>
            <span class='foreground-prop foreground-cable'></span>
            <span class='foreground-prop foreground-lamp-blur'></span>
          </div>

          <div class='room-layer floating-ui'>
            <section class='miri-bubble' data-bubble-tone='{bubble_tone}' aria-live='polite'>
              <div class='speaker-row'><span>Miri</span><small data-live='stamp'>{stamp}</small></div>
              <div class='miri-line' data-live='latest'>{reply}</div>
              <pre class='live-result bubble-result' data-live='result'>{result}</pre>
            </section>

            <form class='air-prompt' method='post' action='/ask' data-action='async' data-air-prompt-form>
              <input name='prompt' autocomplete='off' placeholder='leave a whisper'>
            </form>
          </div>
        </div>
      </section>

      <aside class='room-drawer' data-room-drawer hidden>
        <button class='drawer-scrim' type='button' data-panel-close aria-label='Close'></button>
        <section class='object-lens'>
          <header>
            <span data-panel-title>Talk</span>
            <button type='button' data-panel-close aria-label='Close'>X</button>
          </header>
          <div class='drawer-panel is-active' data-panel='talk' data-panel-label='Miri'>
            <form class='talk-form' method='post' action='/ask' data-action='async'>
              <input name='prompt' placeholder='Say something to Miri'>
            </form>
            <form class='talk-form' method='post' action='/bridge' data-action='async'>
              <input name='wish' placeholder='Ask for a body-aware turn'>
            </form>
          </div>
          <div class='drawer-panel' data-panel='pinboard' data-panel-label='Pinned scraps'>{pinboard_panel}</div>
          <div class='drawer-panel' data-panel='shelf' data-panel-label='Shelf objects'>{shelf_panel}</div>
          <div class='drawer-panel' data-panel='daily' data-panel-label='Marked day'>{daily_panel}</div>
          <div class='drawer-panel' data-panel='body' data-panel-label='Body lights'>{body_panel}</div>
        </section>
      </aside>
    </section>
